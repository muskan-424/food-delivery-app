# CI for TOMATO — backend tests + frontend/admin build on every PR to main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit:
    name: Backend unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  backend-integration:
    name: Backend integration (MongoDB)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci
    env:
      RUN_INTEGRATION_TESTS: "true"
      MONGO_URL: mongodb://ci:ci@localhost:27017/food-delivery-test?authSource=admin
      JWT_SECRET: ci-test-secret-do-not-use-in-production
      ENCRYPTION_KEY: a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:integration

  backend-migrate:
    name: Backend migrations (dry-run)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci
    env:
      MONGO_URL: mongodb://ci:ci@localhost:27017/food-delivery-migrate?authSource=admin
      JWT_SECRET: ci-test-secret-do-not-use-in-production
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run migrate:up
      - run: npm run migrate:status

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:4000

  admin:
    name: Admin (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:4000

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    env:
      CI: "true"
      MONGO_URL: mongodb://127.0.0.1:27017/food-delivery-e2e
      JWT_SECRET: ci-e2e-secret-do-not-use-in-production
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      ENCRYPTION_KEY: a1b2c3d4e5f6789012345678901234567890abcdef1234567890abcdef123456
      PLAYWRIGHT_API_PORT: "4000"
      PLAYWRIGHT_WEB_PORT: "5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run Playwright E2E
        working-directory: frontend
        run: npm run test:e2e

  secret-scan:
    name: Block committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject tracked .env files
        run: |
          forbidden=$(git ls-files | grep -E '(^|/)\.env$' | grep -v '\.env\.example' | grep -v '\.env\.staging\.example' | grep -v '\.env\.docker' || true)
          if [ -n "$forbidden" ]; then
            echo "ERROR: .env files must not be committed:"
            echo "$forbidden"
            exit 1
          fi
          echo "No secret .env files in git index."
