# Staging overlay — use with: docker compose -f docker-compose.yml -f docker-compose.staging.yml up --build
# Load env first: see .env.staging.example

services:
  backend:
    env_file: []
    environment:
      - NODE_ENV=staging
      - PORT=4000
      - MONGO_URL=${MONGO_URL:-mongodb://admin:password@mongodb:27017/food-delivery?authSource=admin}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-staging-change-me-jwt}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-staging-change-me-refresh}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:3001}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://localhost:5173}
      - ENABLE_ESCROW_PAYMENTS=${ENABLE_ESCROW_PAYMENTS:-true}
      - ENABLE_RAZORPAYX_PAYOUTS=${ENABLE_RAZORPAYX_PAYOUTS:-false}
      - ENABLE_USER_KYC=${ENABLE_USER_KYC:-true}
      - KYC_REQUIRED_FOR_PAYOUT=${KYC_REQUIRED_FOR_PAYOUT:-true}
      - KYC_STUB_AUTO_VERIFY=${KYC_STUB_AUTO_VERIFY:-true}
      - ENABLE_EMAIL_OTP=${ENABLE_EMAIL_OTP:-true}
      - ENABLE_AI_AGENT=${ENABLE_AI_AGENT:-true}
      - USE_MOCK_AGENT=${USE_MOCK_AGENT:-true}
      - ENABLE_ORDER_CHAT=${ENABLE_ORDER_CHAT:-true}
      - ENABLE_ORDER_REQUEST_DRAFTS=${ENABLE_ORDER_REQUEST_DRAFTS:-true}
      - ENABLE_VOICE_ASSIST=${ENABLE_VOICE_ASSIST:-true}
    restart: unless-stopped
